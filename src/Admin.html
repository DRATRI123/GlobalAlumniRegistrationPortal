    .chart h3 { font-size: 16.5px; margin-bottom: 14px; }

      <!-- Activity -->

      <!-- Tools -->

  </div>

  <script>window.APP_BOOT = <?!= bootstrapJson ?>;</script>

  <?!= include('JavaScript'); ?>
  <script>
  /* ================================ Admin logic ================================ */
  (function () {
    'use strict';
    var A = window.App, t = A.t, el = A.el, $ = A.$, $$ = A.$$;
    var ROLE_LEVEL = { VIEWER: 1, ADMIN: 2, SUPER_ADMIN: 3 };
    var S = { user: null, stats: null, query: { page: 1 }, result: null, profile: null, editing: false, activity: [] };

    var EDIT_STEPS = A.STEPS.filter(function (s) { return !s.publicOnly; }).map(function (s) {
      return { id: s.id, fields: s.fields.filter(function (f) { return !f.publicOnly; }) };
    });
    var EDIT_FIELDS = [];
    EDIT_STEPS.forEach(function (s) { EDIT_FIELDS = EDIT_FIELDS.concat(s.fields); });
    var CONSENT_KEYS = ['consentStore', 'consentContact', 'consentDirectory', 'consentPhoto', 'consentPrivacy', 'consentTimestamp', 'privacyVersion'];
    var META_KEYS = ['registrationId', 'timestamp', 'status', 'language', 'moderation', 'possibleDuplicateOf', 'adminNotes', 'lastUpdated', 'updatedBy'];
    var MASTER_KEYS = ['timestamp', 'registrationId', 'status', 'fullName', 'gender', 'dob', 'fatherName', 'admissionYear', 'leavingYear',
      'lastStandard', 'division', 'lcNumber', 'favouriteTeacher', 'mobile', 'whatsapp', 'email', 'altPhone', 'countryCode', 'country', 'state',
      'city', 'postalCode', 'address', 'occupation', 'occupationOther', 'organization', 'designation', 'professionalField', 'website',
      'achievements', 'awards', 'socialContributions', 'schoolMemory', 'messageForSchool', 'teachersRemembered', 'attendCentenary',
      'attendReunion', 'volunteer', 'supportDevelopment', 'joinAssociation'].concat(CONSENT_KEYS, ['language', 'moderation', 'possibleDuplicateOf', 'adminNotes', 'lastUpdated', 'updatedBy']);

    function can(role) { return S.user && ROLE_LEVEL[S.user.role] >= ROLE_LEVEL[role]; }
    function errText(res) { return t('adm.err.' + ((res && res.code) || 'SERVER')); }
    function call(fn) {
      var args = Array.prototype.slice.call(arguments);
      return A.api.apply(null, args).then(function (res) {
        if (!res || !res.ok) { var e = new Error('fail'); e.res = res || { code: 'SERVER' }; throw e; }
        return res.data;
      }, function (err) { var e = new Error('net'); e.res = { code: err.code || 'NETWORK' }; throw e; });
    }
    function fail(e) { A.loading(false); A.toast(errText(e.res)); if (e.res && (e.res.code === 'FORBIDDEN' || e.res.code === 'NOT_SIGNED_IN')) deny(e.res.code); }

    /* --------------------------------------------------------------- gate */
    function deny(code) {
      $('#gate').hidden = false; $('#admApp').hidden = true;
      $('#gateLoading').hidden = true; $('#gateDenied').hidden = false;
      $('#gateDeniedText').setAttribute('data-i18n', 'adm.denied.' + (code === 'NOT_SIGNED_IN' ? 'signin' : (code === 'FORBIDDEN' ? 'forbidden' : 'error')));
      A.applyTranslations($('#gateDenied'));
    }
    function boot() {
      call('adminGetContext').then(function (u) {
        S.user = u;
        $('#gate').hidden = true; $('#admApp').hidden = false; $('#admUser').hidden = false;
        $('#admEmail').textContent = u.email;
        renderRole();
        $$('[data-min-role]').forEach(function (n) { n.hidden = !can(n.getAttribute('data-min-role')); });
        loadDashboard();
      }).catch(function (e) { deny(e.res && e.res.code); });
    }
    function renderRole() { if (S.user) $('#admRole').textContent = t('adm.role.' + S.user.role); }

    /* --------------------------------------------------------------- tabs */
    document.addEventListener('click', function (e) {
      var b = e.target.closest('[data-tab]'); if (!b) return;
      var name = b.getAttribute('data-tab');
      $$('[data-tab]').forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); });
      $$('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== name; });
      if (name === 'records' && !S.result) search(1);
      if (name === 'activity') loadActivity();
      if (name === 'tools' && can('SUPER_ADMIN')) loadTools();
    });

    /* ----------------------------------------------------------- overview */
    function loadDashboard() {
      call('adminGetDashboard').then(function (s) { S.stats = s; renderDashboard(); fillFilters(); }).catch(fail);
    }
    function kpi(v, key) { return el('div', { class: 'kpi' }, [el('div', { class: 'kpi__v', text: A.fmtNum(v) }), el('div', { class: 'kpi__l', text: t(key) })]); }
    function barList(container, rows, labelFn) {
      container.textContent = '';
      if (!rows.length) { container.appendChild(el('p', { class: 'field__help', text: t('adm.noData') })); return; }
      var max = rows.reduce(function (m, r) { return Math.max(m, r[1]); }, 1);
      rows.forEach(function (r) {
        container.appendChild(el('div', { class: 'bar' }, [
          el('span', { class: 'bar__name', text: labelFn(r[0]), title: labelFn(r[0]) }),
          el('div', { class: 'bar__track' }, [el('div', { class: 'bar__fill', style: 'width:' + Math.max(3, r[1] / max * 100) + '%' })]),
          el('span', { class: 'bar__n num', text: A.fmtNum(r[1]) })
        ]));
      });
    }
    function columns(container, axis, rows) {
      container.textContent = ''; axis.textContent = '';
      if (!rows.length) { container.appendChild(el('p', { class: 'field__help', text: t('adm.noData') })); return; }
      var max = rows.reduce(function (m, r) { return Math.max(m, r[1]); }, 1);
      rows.forEach(function (r) {
        container.appendChild(el('div', { class: 'col', title: r[0] + ': ' + r[1] }, [
          el('span', { class: 'col__n', text: r[1] ? String(r[1]) : '' }),
          el('div', { class: 'col__bar', style: 'height:' + (r[1] / max * 85) + '%' })
        ]));
      });
      axis.appendChild(el('span', { text: String(rows[0][0]) }));
      axis.appendChild(el('span', { text: String(rows[rows.length - 1][0]) }));
    }
    function renderDashboard() {
      var s = S.stats; if (!s) return;
      var k = $('#kpis'); k.textContent = '';
      [[s.total, 'adm.kpi.total'], [s.countriesCount, 'adm.kpi.countries'], [s.india, 'adm.kpi.india'], [s.abroad, 'adm.kpi.abroad'],
        [s.last7, 'adm.kpi.last7'], [s.participation.attendCentenary.YES, 'adm.kpi.attending'], [s.pendingModeration, 'adm.kpi.pending'],
        [s.softDuplicates, 'adm.kpi.duplicates']].forEach(function (x) { k.appendChild(kpi(x[0], x[1])); });
      columns($('#chYear'), $('#chYearAxis'), s.byYear);
      columns($('#chDaily'), $('#chDailyAxis'), s.daily.map(function (d) { return [A.fmtDate(d[0]), d[1]]; }));
      barList($('#chCountry'), s.byCountry.slice(0, 15), A.countryName);
      barList($('#chOcc'), s.byOccupation, function (c) { return t('opt.occ.' + c); });
      barList($('#chState'), s.byState.slice(0, 15), function (x) { return x; });
      barList($('#chCity'), s.byCity.slice(0, 15), function (x) { return x; });
      var tb = $('#chPart'); tb.textContent = '';
      tb.appendChild(el('tr', null, [el('th', { text: '' }), el('th', { text: t('opt.part.YES') }), el('th', { text: t('opt.part.MAYBE') }), el('th', { text: t('opt.part.NO') })]));
      Object.keys(s.participation).forEach(function (key) {
        var p = s.participation[key];
        tb.appendChild(el('tr', null, [el('td', { text: t('f.' + key) }), el('td', { class: 'n', text: A.fmtNum(p.YES) }), el('td', { class: 'n', text: A.fmtNum(p.MAYBE) }), el('td', { class: 'n', text: A.fmtNum(p.NO) })]));
      });
    }
    $('#btnRefresh').addEventListener('click', loadDashboard);

    /* ------------------------------------------------------------ records */
    function fillFilters() {
      var c = $('#qCountry'), cur = c.value; c.textContent = '';
      c.appendChild(el('option', { value: '', text: t('adm.f.all') }));
      (S.stats ? S.stats.byCountry : []).forEach(function (r) { c.appendChild(el('option', { value: r[0], text: A.countryName(r[0]) + ' (' + r[1] + ')' })); });
      c.value = cur;
      var y = $('#qYear'), cy = y.value; y.textContent = '';
      y.appendChild(el('option', { value: '', text: t('adm.f.all') }));
      (S.stats ? S.stats.byYear.slice().reverse() : []).forEach(function (r) { y.appendChild(el('option', { value: String(r[0]), text: r[0] + ' (' + r[1] + ')' })); });
      y.value = cy;
    }
    function currentQuery(page) {
      return { field: $('#qField').value, q: $('#qText').value, country: $('#qCountry').value, year: $('#qYear').value,
        moderation: $('#qMod').value, duplicatesOnly: $('#qDup').checked, page: page || 1 };
    }
    function search(page) {
      S.query = currentQuery(page);
      $('#rows').textContent = '';
      $('#resultCount').textContent = t('common.loading');
      call('adminSearch', S.query).then(function (r) { S.result = r; renderRows(); }).catch(fail);
    }
    function modTag(m) {
      var cls = m === 'APPROVED' ? 'tag tag--ok' : (m === 'PENDING' ? 'tag tag--warn' : 'tag tag--mute');
      return el('span', { class: cls, text: t('opt.mod.' + (m || 'NOT_CONSENTED')) });
    }
    function renderRows() {
      var r = S.result; if (!r) return;
      var tb = $('#rows'); tb.textContent = '';
      r.rows.forEach(function (x) {
        var tr = el('tr', { tabindex: '0', 'data-id': x.registrationId }, [
          el('td', { class: 'num', text: x.registrationId }),
          el('td', null, [el('strong', { text: x.fullName })]),
          el('td', { text: x.admissionYear + '–' + x.leavingYear }),
          el('td', { text: [x.city, A.countryName(x.countryCode)].filter(Boolean).join(', ') }),
          el('td', { text: x.occupation ? t('opt.occ.' + x.occupation) : '—' }),
          el('td', { text: x.mobile }),
          el('td', { text: A.fmtDate(x.timestamp, true) }),
          el('td', null, [modTag(x.moderation), x.possibleDuplicateOf ? el('span', { class: 'tag tag--warn', style: 'margin-left:4px', text: t('adm.tag.duplicate') }) : null])
        ]);
        tb.appendChild(tr);
      });
      $('#rowsEmpty').hidden = r.rows.length > 0;
      $('#resultCount').textContent = t('adm.resultCount', { n: A.fmtNum(r.total) });
      $('#pgInfo').textContent = r.page + ' / ' + r.pages;
      $('#pgPrev').disabled = r.page <= 1; $('#pgNext').disabled = r.page >= r.pages;
    }
    $('#filterForm').addEventListener('submit', function (e) { e.preventDefault(); search(1); });
    $('#pgPrev').addEventListener('click', function () { search(S.query.page - 1); });
    $('#pgNext').addEventListener('click', function () { search(S.query.page + 1); });
    $('#rows').addEventListener('click', function (e) { var tr = e.target.closest('tr[data-id]'); if (tr) openProfile(tr.getAttribute('data-id')); });
    $('#rows').addEventListener('keydown', function (e) { if (e.key === 'Enter') { var tr = e.target.closest('tr[data-id]'); if (tr) openProfile(tr.getAttribute('data-id')); } });

    /* ------------------------------------------------------------- export */
    function download(res) {
      try {
        var bin = atob(res.base64), bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        var url = URL.createObjectURL(new Blob([bytes], { type: res.mimeType }));
        var a = el('a', { href: url, download: res.name }); document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
      } catch (e) { /* fall back to Drive link below */ }
      var box = $('#exportResult'); box.textContent = ''; box.hidden = false;
      box.appendChild(el('span', { text: t('adm.exportDone', { n: res.count, name: res.name }) + ' ' }));
      box.appendChild(el('a', { href: res.url, target: '_blank', rel: 'noopener', text: t('adm.openDrive') }));
    }
    function exportAs(fmt) {
      A.loading(true, 'adm.exporting');
      call('adminExport', currentQuery(1), fmt).then(function (r) { A.loading(false); download(r); }).catch(fail);
    }
    $('#btnCsv').addEventListener('click', function () { exportAs('csv'); });
    $('#btnXlsx').addEventListener('click', function () { exportAs('xlsx'); });

    /* ------------------------------------------------------------ profile */
    function openProfile(id) {
      A.loading(true, 'common.loading');
      call('adminGetProfile', id).then(function (p) {
        A.loading(false); S.profile = p; S.editing = false; renderProfile(); A.openModal('profileModal');
      }).catch(fail);
    }
    function metaValue(key, v) {
      if (v === '' || v === null || v === undefined) return '—';
      if (typeof v === 'boolean') return v ? t('common.yes') : t('common.no');
      if (key === 'timestamp' || key === 'lastUpdated' || key === 'consentTimestamp') return A.fmtDate(v, true);
      if (key === 'moderation') return t('opt.mod.' + v);
      if (key === 'language') return t('opt.lang.' + v);
      if (key === 'status') return t('opt.status.' + v);
      return String(v);
    }
    function dlGroup(titleKey, pairs) {
      var dl = el('dl');
      pairs.forEach(function (p) { dl.appendChild(el('dt', { text: p[0] })); dl.appendChild(el('dd', { text: p[1] })); });
      return el('div', { class: 'review__group' }, [el('div', { class: 'review__head' }, [el('h3', { text: t(titleKey) })]), dl]);
    }
    function renderProfile() {
      var p = S.profile, body = $('#pfBody');
      $('#pfTitle').textContent = p.fullName + ' · ' + p.registrationId;
      body.textContent = '';
      var photo = el('div', { class: 'profile-photo' }, [p.photoDataUrl ? el('img', { src: p.photoDataUrl, alt: t('f.photo') }) : document.createTextNode(A.initials(p.fullName))]);
      body.appendChild(el('div', { class: 'profile-head' }, [photo, el('div', null, [
        el('h3', { style: 'margin:0', text: p.fullName }),
        el('div', { class: 'field__help', text: t('adm.col.batch') + ': ' + p.admissionYear + '–' + p.leavingYear + ' · ' + [p.city, A.countryName(p.countryCode)].filter(Boolean).join(', ') }),
        el('div', { style: 'margin-top:6px' }, [modTag(p.moderation), p.possibleDuplicateOf ? el('span', { class: 'tag tag--warn', style: 'margin-left:6px', text: t('adm.tag.duplicateOf', { ids: p.possibleDuplicateOf }) }) : null])
      ])]));

      var actions = el('div', { class: 'profile-actions' });
      if (can('ADMIN')) {
        actions.appendChild(el('button', { type: 'button', class: 'btn btn--primary btn--sm', text: t(S.editing ? 'common.cancel' : 'common.edit'), onclick: function () { S.editing = !S.editing; renderProfile(); } }));
        actions.appendChild(el('button', { type: 'button', class: 'btn btn--light btn--sm', text: t('adm.report'), onclick: generateReport }));
      }
      actions.appendChild(el('button', { type: 'button', class: 'btn btn--light btn--sm', text: t('adm.print'), onclick: printProfile }));
      if (can('ADMIN') && p.consentDirectory) {
        var sel = el('select', { class: 'select', style: 'width:auto;min-height:36px;padding-top:4px;padding-bottom:4px', 'aria-label': t('adm.f.moderation') });
        ['PENDING', 'APPROVED', 'HIDDEN'].forEach(function (m) { sel.appendChild(el('option', { value: m, text: t('opt.mod.' + m) })); });
        sel.value = p.moderation;
        sel.addEventListener('change', function () { setModeration(sel.value); });
        actions.appendChild(sel);
      }
      if (can('SUPER_ADMIN')) actions.appendChild(el('button', { type: 'button', class: 'btn btn--danger btn--sm', text: t('adm.delete'), onclick: deleteRecord }));
      body.appendChild(actions);
      body.appendChild(el('div', { id: 'reportResult', class: 'alert alert--ok result-links', hidden: true }));

      if (S.editing) { body.appendChild(editForm(p)); return; }

      var wrap = el('div', { class: 'review' });
      EDIT_STEPS.forEach(function (s) {
        wrap.appendChild(dlGroup('step.' + s.id + '.title', s.fields.filter(function (f) { return A.isVisible(f, p) || p[f.name]; })
          .map(function (f) { return [t('f.' + f.name), A.displayValue(f, p, 'admin')]; })));
      });
      wrap.appendChild(dlGroup('step.consent.title', CONSENT_KEYS.map(function (k) { return [t('f.' + k), metaValue(k, p[k])]; })));
      wrap.appendChild(dlGroup('adm.group.meta', META_KEYS.map(function (k) { return [t('f.' + k), metaValue(k, p[k])]; })));
      body.appendChild(wrap);
    }

    function editForm(p) {
      var form = el('form', { novalidate: true, id: 'editForm' });
      EDIT_STEPS.forEach(function (s) {
        form.appendChild(el('h3', { text: t('step.' + s.id + '.title') }));
        var grid = el('div', { class: 'fields' });
        s.fields.forEach(function (f) { grid.appendChild(A.renderField(f, { mode: 'admin', prefix: 'e' })); });
        form.appendChild(grid);
      });
      form.appendChild(el('h3', { text: t('f.adminNotes') }));
      form.appendChild(el('div', { class: 'field', 'data-field': 'adminNotes' }, [el('textarea', { class: 'textarea', name: 'adminNotes', maxlength: 1000, 'aria-label': t('f.adminNotes') })]));
      form.appendChild(el('div', { class: 'alert alert--err', id: 'editError', hidden: true, role: 'alert' }));
      form.appendChild(el('div', { class: 'form-nav' }, [
        el('button', { type: 'button', class: 'btn btn--light', text: t('common.cancel'), onclick: function () { S.editing = false; renderProfile(); } }),
        el('button', { type: 'submit', class: 'btn btn--primary', text: t('common.save') })
      ]));
      setTimeout(function () {
        A.writeValues(form, EDIT_FIELDS, p, 'admin');
        form.querySelector('[name="adminNotes"]').value = p.adminNotes || '';
        A.refreshConditional(form, EDIT_FIELDS, A.readValues(form, EDIT_FIELDS, 'admin'));
      }, 0);
      form.addEventListener('change', function () { A.refreshConditional(form, EDIT_FIELDS, A.readValues(form, EDIT_FIELDS, 'admin')); });
      form.addEventListener('submit', function (e) { e.preventDefault(); saveEdit(form); });
      return form;
    }
    function saveEdit(form) {
      var d = A.readValues(form, EDIT_FIELDS, 'admin'), bad = null;
      EDIT_FIELDS.forEach(function (f) { var c = A.validateField(f, d, 'admin'); A.showError(form, f.name, c); if (c && !bad) bad = f.name; });
      if (bad) { var w = form.querySelector('[data-field="' + bad + '"]'); if (w) w.scrollIntoView({ block: 'center' }); return; }
      d.adminNotes = form.querySelector('[name="adminNotes"]').value;
      A.loading(true, 'common.saving');
      call('adminUpdateProfile', S.profile.registrationId, d).then(function (r) {
        A.loading(false);
        var photo = S.profile.photoDataUrl;
        S.profile = r.record; S.profile.photoDataUrl = photo; S.editing = false;
        renderProfile(); A.toast(r.changed.length ? t('adm.saved', { n: r.changed.length }) : t('adm.noChanges'));
        if (S.result) search(S.query.page);
        S.statsDirty = true;
      }).catch(function (e) {
        A.loading(false);
        if (e.res && e.res.code === 'VALIDATION' && e.res.extra && e.res.extra.errors) {
          Object.keys(e.res.extra.errors).forEach(function (k) { A.showError(form, k, e.res.extra.errors[k]); });
        }
        var box = $('#editError'); box.hidden = false; box.textContent = errText(e.res);
      });
    }
    function setModeration(m) {
      call('adminSetModeration', S.profile.registrationId, m).then(function (r) {
        S.profile.moderation = r.moderation; renderProfile(); A.toast(t('adm.moderationSaved'));
        if (S.result) search(S.query.page);
      }).catch(fail);
    }
    function deleteRecord() {
      var id = S.profile.registrationId;
      var typed = window.prompt(t('adm.deleteConfirm', { id: id }));
      if (typed === null) return;
      A.loading(true, 'common.saving');
      call('adminDeleteRecord', id, typed).then(function () {
        A.loading(false); A.closeModal('profileModal'); A.toast(t('adm.deleted', { id: id })); search(1); loadDashboard();
      }).catch(fail);
    }
    function reportLabels() {
      var L = { fields: {}, groups: {}, options: {}, title: t('adm.reportTitle'), generated: t('adm.generated'), yes: t('common.yes'), no: t('common.no') };
      MASTER_KEYS.forEach(function (k) { if (A.has('f.' + k)) L.fields[k] = t('f.' + k); });
      A.STEPS.forEach(function (s) { L.groups[s.id] = t('step.' + s.id + '.title'); });
      L.groups.meta = t('adm.group.meta');
      (A.boot.options.GENDER || []).forEach(function (o) { L.options['gender.' + o] = t('opt.gender.' + o); });
      (A.boot.options.STANDARDS || []).forEach(function (o) { L.options['lastStandard.' + o] = t('opt.std.' + o); });
      (A.boot.options.OCCUPATION || []).forEach(function (o) { L.options['occupation.' + o] = t('opt.occ.' + o); });
      ['attendCentenary', 'attendReunion', 'volunteer', 'supportDevelopment', 'joinAssociation'].forEach(function (k) {
        (A.boot.options.PARTICIPATION || []).forEach(function (o) { L.options[k + '.' + o] = t('opt.part.' + o); });
      });
      (A.boot.options.MODERATION || []).forEach(function (o) { L.options['moderation.' + o] = t('opt.mod.' + o); });
      L.options['language.gu'] = t('opt.lang.gu'); L.options['language.hi'] = t('opt.lang.hi');
      L.options['status.ACTIVE'] = t('opt.status.ACTIVE');
      if (S.profile.countryCode) L.options['countryCode.' + S.profile.countryCode] = A.countryName(S.profile.countryCode);
      return L;
    }
    function generateReport() {
      A.loading(true, 'adm.generating');
      call('adminGenerateReport', S.profile.registrationId, reportLabels()).then(function (r) {
        A.loading(false);
        var box = $('#reportResult'); box.textContent = ''; box.hidden = false;
        box.appendChild(el('span', { text: t('adm.reportReady') + ' ' }));
        box.appendChild(el('a', { href: r.docUrl, target: '_blank', rel: 'noopener', text: t('adm.openDoc') }));
        box.appendChild(el('a', { href: r.pdfUrl, target: '_blank', rel: 'noopener', text: t('adm.openPdf') }));
      }).catch(fail);
    }
    function printProfile() {
      document.body.classList.add('print-profile');
      window.print();
      setTimeout(function () { document.body.classList.remove('print-profile'); }, 500);
    }

    /* ----------------------------------------------------------- activity */
    function loadActivity() {
      call('adminGetActivity', 150).then(function (rows) { S.activity = rows; renderActivity(); }).catch(fail);
    }
    function renderActivity() {
      var tb = $('#actRows'); tb.textContent = '';
      S.activity.forEach(function (r) {
        tb.appendChild(el('tr', null, [el('td', { text: A.fmtDate(r.timestamp, true) }), el('td', { text: r.action }), el('td', { class: 'num', text: r.registrationId || '—' }),
          el('td', { text: r.actor }), el('td', { text: r.status }), el('td', { style: 'max-width:360px;word-break:break-word', text: r.details })]));
      });
    }
    $('#btnActRefresh').addEventListener('click', loadActivity);

    /* -------------------------------------------------------------- tools */
    function loadTools() {
      call('adminGetTools').then(function (r) {
        var l = $('#toolLinks'); l.textContent = '';
        l.appendChild(el('a', { href: r.spreadsheetUrl, target: '_blank', rel: 'noopener', text: t('adm.tools.sheet') }));
        l.appendChild(el('a', { href: r.folderUrl, target: '_blank', rel: 'noopener', text: t('adm.tools.folder') }));
        var ul = $('#adminList'); ul.textContent = '';
        r.admins.forEach(function (a) { ul.appendChild(el('li', { text: a.email + ' — ' + t('adm.role.' + a.role) + (a.active ? '' : ' (' + t('adm.inactive') + ')') })); });
      }).catch(fail);
    }
    $('#btnRebuild').addEventListener('click', function () {
      A.loading(true, 'common.loading');
      call('adminRebuildSummaries').then(function (r) { A.loading(false); A.toast(t('adm.tools.rebuilt', { n: r.records })); loadDashboard(); }).catch(fail);
    });
    $('#btnBackup').addEventListener('click', function () {
      A.loading(true, 'common.loading');
      call('adminRunBackup').then(function (r) { A.loading(false); A.toast(t('adm.tools.backedUp', { name: r.name })); }).catch(fail);
    });

    A.onLangChange(function () {
      renderRole(); renderDashboard(); fillFilters(); renderRows(); renderActivity();
      if (S.profile && !$('#profileModal').hidden && !S.editing) renderProfile();
    });

    document.addEventListener('DOMContentLoaded', function () { A.initLang(); boot(); });
  })();
  </script>
</body>
</html>
