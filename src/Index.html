  <script>
  /* ------------------------------ Homepage logic ------------------------------ */
  (function () {
    'use strict';
    var A = window.App, t = A.t, el = A.el, $ = A.$;
    var state = { stats: null, dir: null, dirPage: 1, memories: [] };

    function showView(name) {
      $('#view-home').hidden = name !== 'home';
      $('#view-register').hidden = name !== 'register';
      $('#navLinks').classList.remove('is-open');
      $('.nav__toggle').setAttribute('aria-expanded', 'false');
      window.scrollTo(0, 0);
      if (name === 'register' && A.Registration) A.Registration.open();
    }
    A.showView = showView;

    function scrollToSection(id) {
      if ($('#view-home').hidden) showView('home');
      var n = document.getElementById(id);
      if (n) { var y = n.getBoundingClientRect().top + window.pageYOffset - 70; window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' }); }
      $('#navLinks').classList.remove('is-open');
    }

    document.addEventListener('click', function (e) {
      var s = e.target.closest('[data-scroll]');
      if (s) { e.preventDefault(); scrollToSection(s.getAttribute('data-scroll')); return; }
      var a = e.target.closest('[data-action]');
      if (a) {
        e.preventDefault();
        var act = a.getAttribute('data-action');
        if (act === 'register') showView('register');
        if (act === 'home') showView('home');
      }
    });
    $('.nav__toggle').addEventListener('click', function () {
      var open = $('#navLinks').classList.toggle('is-open');
      this.setAttribute('aria-expanded', String(open));
    });

    /* privacy policy (paragraphs from dictionary) */
    function renderPrivacy() {
      var b = $('#privacyBody'); b.textContent = '';
      for (var i = 1; i <= 8; i++) {
        if (!A.has('privacy.h' + i)) break;
        b.appendChild(el('h3', { text: t('privacy.h' + i) }));
        b.appendChild(el('p', { text: t('privacy.p' + i, { years: A.settings.DATA_RETENTION_YEARS || 10, email: A.settings.CONTACT_EMAIL || '' }) }));
      }
      b.appendChild(el('p', { class: 'field__help', text: t('privacy.version') + ': ' + (A.boot.privacyVersion || '') }));
    }

    /* contact */
    function renderContact() {
      var s = A.settings;
      var ph = $('#contactPhone'); ph.textContent = s.CONTACT_PHONE || '—'; ph.href = 'tel:' + String(s.CONTACT_PHONE || '').replace(/[^\d+]/g, '');
      var em = $('#contactEmail'); em.textContent = s.CONTACT_EMAIL || '—'; em.href = 'mailto:' + (s.CONTACT_EMAIL || '');
      if (/^https?:\/\//i.test(s.CONTACT_WEBSITE || '')) { var w = $('#contactWeb'); w.href = s.CONTACT_WEBSITE; w.textContent = s.CONTACT_WEBSITE; $('#contactWebWrap').hidden = false; }
    }

    /* statistics – only real, aggregated data */
    function bars(container, rows, labelFn) {
      container.textContent = '';
      var max = rows.reduce(function (m, r) { return Math.max(m, r[1]); }, 1);
      rows.forEach(function (r) {
        var fill = el('div', { class: 'bar__fill' });
        container.appendChild(el('div', { class: 'bar' }, [
          el('span', { class: 'bar__name', text: labelFn(r[0]), title: labelFn(r[0]) }),
          el('div', { class: 'bar__track' }, [fill]),
          el('span', { class: 'bar__n num', text: A.fmtNum(r[1]) })
        ]));
        requestAnimationFrame(function () { setTimeout(function () { fill.style.width = Math.max(3, r[1] / max * 100) + '%'; }, 60); });
      });
    }
    function renderStats() {
      var s = state.stats;
      if (!s || !s.ok || !s.enabled) { $('#alumni').hidden = !!(s && s.ok && !s.enabled); return; }
      var empty = !s.total;
      $('#statsBlock').hidden = empty; $('#statsEmpty').hidden = !empty;
      $('#statTotal').textContent = A.fmtNum(s.total);
      $('#statCountries').textContent = A.fmtNum(s.countriesCount);
      $('#statIndia').textContent = A.fmtNum(s.india);
      $('#statAbroad').textContent = A.fmtNum(s.abroad);
      $('#heroAlumni').textContent = A.fmtNum(s.total);
      $('#heroCountries').textContent = A.fmtNum(s.countriesCount);
      bars($('#countryBars'), s.byCountry.slice(0, 10), A.countryName);
      bars($('#decadeBars'), s.byDecade, function (d) { return t('alumni.decade', { d: d }); });
    }

    /* directory */
    function renderDirectory() {
      var d = state.dir;
      if (!d || !d.ok || !d.enabled) { $('#directory').hidden = true; return; }
      if (!d.total && !$('#dirQ').value) { $('#directory').hidden = true; return; }
      $('#directory').hidden = false;
      var g = $('#dirGrid'); g.textContent = '';
      d.rows.forEach(function (p) {
        var meta = [t('dir.batch', { y: p.year }), [p.city, A.countryName(p.country)].filter(Boolean).join(', ')].join(' · ');
        g.appendChild(el('div', { class: 'card person' }, [
          el('div', { class: 'avatar', text: A.initials(p.name), 'aria-hidden': 'true' }),
          el('div', null, [el('div', { class: 'person__name', text: p.name }), el('div', { class: 'person__meta', text: meta }),
            p.occupation ? el('div', { class: 'person__meta', text: t('opt.occ.' + p.occupation) }) : null])
        ]));
      });
      $('#dirEmpty').hidden = d.rows.length > 0;
      $('#dirPager').hidden = d.pages <= 1;
      $('#dirPage').textContent = d.page + ' / ' + d.pages;
      $('#dirPrev').disabled = d.page <= 1; $('#dirNext').disabled = d.page >= d.pages;
    }
    function loadDirectory(page) {
      state.dirPage = page || 1;
      A.api('getPublicDirectory', { q: $('#dirQ').value, page: state.dirPage })
        .then(function (r) { state.dir = r; renderDirectory(); })
        .catch(function () { $('#directory').hidden = true; });
    }
    $('#dirForm').addEventListener('submit', function (e) { e.preventDefault(); loadDirectory(1); });
    $('#dirPrev').addEventListener('click', function () { loadDirectory(state.dirPage - 1); });
    $('#dirNext').addEventListener('click', function () { loadDirectory(state.dirPage + 1); });

    /* memories */
    function renderMemories() {
      var list = $('#memList'); list.textContent = '';
      state.memories.forEach(function (m) {
        list.appendChild(el('blockquote', { class: 'memory reveal is-visible' }, [
          el('p', { text: m.memory }),
          el('footer', { text: '— ' + m.name + ' · ' + t('dir.batch', { y: m.year }) + (m.country ? ' · ' + A.countryName(m.country) : '') })
        ]));
      });
      $('#memEmpty').hidden = state.memories.length > 0;
    }

    /* reveal on scroll */
    function initReveal() {
      var items = A.$$('.reveal');
      if (!('IntersectionObserver' in window)) { items.forEach(function (i) { i.classList.add('is-visible'); }); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('is-visible'); io.unobserve(en.target); } });
      }, { rootMargin: '0px 0px -8% 0px' });
      items.forEach(function (i) { io.observe(i); });
    }

    function loadPublicData() {
      A.api('getPublicStats').then(function (r) { state.stats = r; renderStats(); }).catch(function () { $('#statsEmpty').hidden = false; $('#statsBlock').hidden = true; });
      loadDirectory(1);
      A.api('getPublicMemories').then(function (r) { state.memories = (r && r.rows) || []; renderMemories(); }).catch(function () { renderMemories(); });
    }

    A.onLangChange(function () { renderPrivacy(); renderStats(); renderDirectory(); renderMemories(); });

    document.addEventListener('DOMContentLoaded', function () {
      A.initLang();
      A.hydrateIcons(document);
      var dl = $('#indianStates');
      A.INDIAN_STATES.forEach(function (s) { dl.appendChild(el('option', { value: s })); });
      renderPrivacy(); renderContact(); initReveal();
      if (A.Registration) A.Registration.init();
      loadPublicData();
    });
  })();
  </script>
</body>
</html>
